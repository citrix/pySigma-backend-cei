[tool.poetry]
name = "pySigma-backend-uberAgent"
version = "0.3.74"
description = "pySigma uAQL backend"
authors = ["Citrix Systems, Inc. <info@citrix.com>"]
license = "MIT"
repository = "https://github.com/citrix/pySigma-backend-cei"
packages = [
    { include = "sigma" }
]

[tool.poetry.dependencies]
python = "^3.10"
pysigma = "^0.11.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
coverage = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
